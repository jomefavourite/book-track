name: Ingest Approved Changelog

on:
  push:
    branches: [main]
    paths:
      - "changelog/CHANGELOG.json"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Ingest into MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/ingest-to-mongo.ts