name: Generate Changelog Entry

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build PR context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/build-pr-context.ts
        # writes ./.tmp/pr-context.json

      - name: Generate structured changelog JSON via AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/generate-changelog.ts
        # writes changelog/generated/pr-<num>.json

      - name: Render Markdown for humans
        run: npx tsx scripts/render-changelog-md.ts
        # writes changelog/generated/pr-<num>.md

      - name: Create PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/changelog-pr-${{ github.event.pull_request.number }}
          title: "chore(changelog): add entry for PR #${{ github.event.pull_request.number }}"
          commit-message: "chore(changelog): PR #${{ github.event.pull_request.number }}"
          body: "Auto-generated changelog entry. Please review/edit before merge."
          add-paths: |
            changelog/generated/