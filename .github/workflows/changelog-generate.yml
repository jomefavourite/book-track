name: Generate Changelog Entry

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build PR context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/build-pr-context.ts
        # writes ./.tmp/pr-context.json

      - name: Generate structured changelog JSON via AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/generate-changelog.ts
        # writes ./.tmp/ai-changelog.json

      - name: Consolidate into canonical changelog files
        run: npx tsx scripts/update-changelog.ts
        # updates changelog/CHANGELOG.json and changelog/CHANGELOG.md

      - name: Create PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/changelog
          title: "chore(changelog): update consolidated changelog"
          commit-message: "chore(changelog): update consolidated changelog (PR #${{ github.event.pull_request.number }})"
          body: "Auto-generated consolidated changelog update for merged PR #${{ github.event.pull_request.number }}. Please review/edit before merge."
          add-paths: |
            changelog/CHANGELOG.json
            changelog/CHANGELOG.md